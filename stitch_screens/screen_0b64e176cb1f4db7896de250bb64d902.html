        // Tab Switching Logic

        const tabUser = document.getElementById('tab-user');

        function setActiveTab(active, inactive) {
            active.classList.add('bg-surface-container-lowest', 'shadow-sm', 'text-on-surface');
            active.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            
            inactive.classList.remove('bg-surface-container-lowest', 'shadow-sm', 'text-on-surface');
            inactive.classList.add('text-on-surface-variant', 'hover:text-on-surface');
        }

        tabAdmin.addEventListener('click', () => setActiveTab(tabAdmin, tabUser));
        tabUser.addEventListener('click', () => setActiveTab(tabUser, tabAdmin));
