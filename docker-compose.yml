# ============================================================
# WordPress Site Manager - Docker Compose
# ============================================================
version: "3.8"

services:
  wp-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wp-site-manager
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8011}:8011"
    environment:
      - WP_HOST=0.0.0.0
      - WP_PORT=8011
      - WP_WORKERS=4
      - FLASK_ENV=production
      - WP_DATA_DIR=/app/backend/data
      # 1Panel API configuration (override in .env or here)
      - PANEL_HOST=${PANEL_HOST:-167.172.142.95}
      - PANEL_PORT=${PANEL_PORT:-3500}
      - PANEL_API_KEY=${PANEL_API_KEY:-gk7FQSSTtnudJbImg0E8MdXbmU3v7qF6}
      # Admin credentials (override for production)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-adsadmin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Mm123567..}
      # Security (CHANGE IN PRODUCTION!)
      - SECRET_KEY=${SECRET_KEY:-wp-manager-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
    volumes:
      # Persist only database, plugins and themes (NOT the entire backend/ — code lives in image)
      - wp-db:/app/backend/data
      - wp-plugins:/app/backend/plugins
      - wp-themes:/app/backend/themes
      - wp-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wp-network

volumes:
  wp-db:
    driver: local
  wp-plugins:
    driver: local
  wp-themes:
    driver: local
  wp-logs:
    driver: local

networks:
  wp-network:
    driver: bridge
